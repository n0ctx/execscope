name: Verify and package
on:
  push:
    tags: ['v*']
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy --target '${{ matrix.target }}'
      - run: cargo +1.100.0 fmt --all -- --check
      - run: cargo +1.100.0 clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo +1.100.0 test --locked --all-targets --all-features
      - run: cargo +1.100.0 build --locked --release --target '${{ matrix.target }}'
      - name: Exercise the built server and package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          suffix=''
          py=python3
          if [[ "$TARGET" == *windows* ]]; then suffix='.exe'; py=python; fi
          "$py" -X utf8 tests/protocol.py "target/$TARGET/release/execscope$suffix"
          "$py" -X utf8 scripts/package.py "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: execscope-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: verify
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: execscope-*
          path: dist
          merge-multiple: true
      - name: Check and attach archives
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 5
          sha256sum --check --strict -- *.sha256
          gh release create "$TAG" --verify-tag --generate-notes -- *
